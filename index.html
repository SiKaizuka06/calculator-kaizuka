<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>
        <div class="button">
            <button class="function" id="clear" aria-label="Hapus semua">AC</button>
            <button class="function" id="backspace" aria-label="Hapus satu angka">DEL</button>
            <button class="function" id="percent" aria-label="Persen">%</button>
            <button class="operator" data-operator="/" aria-label="Bagi">÷</button>
            
            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button class="number zero" data-number="0">0</button>
            <button class="decimal" id="decimal">.</button>
            <button class="equals" id="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
